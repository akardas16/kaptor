name: KaptorSampleIos
options:
  bundleIdPrefix: com.akardas.kaptor
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  KaptorSampleIos:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        # Required by Compose Multiplatform on iOS — the app aborts on launch without it.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akardas.kaptor.sampleios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        # Link the prebuilt Kotlin/Native static framework (built by Gradle).
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../sample-ios-shared/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
          - -lsqlite3
